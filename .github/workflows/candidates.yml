name: Update view candidates

# Once a week (Monday, early morning UTC) and by hand (GitHub -> Actions -> "Update view candidates" -> Run workflow).
# Builds data/view-candidates.json from Wikidata and Wikipedia page views (scripts/build-candidates.mjs).
# This is a list of places, not pages: nothing on the site changes, and the commit does not start a deploy.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: candidates
  cancel-in-progress: false

# contents: write lets the run save the new list into the repository.
permissions:
  contents: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No packages to install: the scripts use only what Node.js brings.
      - name: Test the list logic
        run: npm run test:candidates

      - name: Build the list
        run: npm run candidates

      # If the new list is broken, nothing is saved and the old list stays.
      - name: Check the list
        run: npm run check:candidates

      - name: Save the list to the repository
        run: |
          if [ -n "$(git status --porcelain data/view-candidates.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/view-candidates.json
            git commit -m "Update view candidates [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "The list did not change."
          fi
