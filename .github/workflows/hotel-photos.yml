name: Find hotel photos

# By hand: GitHub -> Actions -> "Find hotel photos" -> Run workflow.
# Looks for licensed photos of every hotel on Wikimedia Commons (scripts/find-hotel-photos.mjs) and saves the list:
# data/hotel-photo-candidates.json and docs/hotel-photos-report.md. Nothing goes on the site; the commit has [skip ci], so no deploy.
on:
  workflow_dispatch:

concurrency:
  group: hotel-photos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No packages to install: the script uses only what Node.js brings.
      - name: Test the photo checks
        run: npm run test:hotel-photos

      # REVIEW_DIR: also download each usable photo (640 px to look at, 1280 px for the site) for the eye check.
      - name: Look for hotel photos on Wikimedia Commons
        env:
          REVIEW_DIR: ${{ runner.temp }}/review
        run: npm run hotel-photos

      # The downloaded photos go to the branch "photo-review" (replaced on every run), never to main: Claude looks at them
      # in the chat, and only the chosen ones are added to the site.
      - name: Put the photos on the photo-review branch
        env:
          REVIEW_DIR: ${{ runner.temp }}/review
        run: |
          cp data/hotel-photo-candidates.json "$REVIEW_DIR/candidates.json"
          cd "$REVIEW_DIR"
          git init -q -b photo-review
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Hotel photos to look at"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photo-review

      - name: Save the list to the repository
        run: |
          if [ -n "$(git status --porcelain data/hotel-photo-candidates.json docs/hotel-photos-report.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/hotel-photo-candidates.json docs/hotel-photos-report.md
            git commit -m "Hotel photo candidates from Wikimedia Commons [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "The list did not change."
          fi
